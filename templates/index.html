<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plivo IVR Demo</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; background: #f5f6f8; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 16px; }
  input { padding: 10px; font-size: 1rem; width: 60%; border: 1px solid #ccc; border-radius: 6px; }
  button { padding: 10px 18px; font-size: 1rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  button:disabled { background: #94a3b8; }
  #status { margin-top: 10px; font-size: .95rem; }
  #log { font-family: ui-monospace, monospace; font-size: .9rem; min-height: 120px; }
  #log div { padding: 4px 0; border-bottom: 1px solid #eee; }
  .t { color: #888; margin-right: 8px; }
  .flow { font-size: .85rem; color: #555; }
</style>
</head>
<body>
  <h1>Plivo IVR Demo</h1>

  <div class="card">
    <label>Phone number to call</label><br><br>
    <input id="to" value="{{ default_phone }}" placeholder="+91XXXXXXXXXX">
    <button id="btn" onclick="startCall()">Call me</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <strong>Live call log</strong>
    <div id="log"><div style="color:#888">Nothing yet. Click "Call me".</div></div>
  </div>

  <div class="card flow">
    Flow: OTP &rarr; Level 1 (1 English / 2 Spanish) &rarr; Level 2 (1 audio / 2 live associate)
  </div>

<script>
let timer = null;

async function startCall() {
  const btn = document.getElementById("btn");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.textContent = "Starting call...";
  const body = new URLSearchParams({ to: document.getElementById("to").value });
  try {
    const res = await fetch("/call", { method: "POST", body });
    const data = await res.json();
    status.textContent = data.message;
    if (data.ok && !timer) timer = setInterval(loadEvents, 1000);
  } catch (e) {
    status.textContent = "Error: " + e;
  }
  btn.disabled = false;
}

async function loadEvents() {
  const res = await fetch("/events");
  const events = await res.json();
  const log = document.getElementById("log");
  log.innerHTML = "";
  events.forEach(e => {
    const row = document.createElement("div");
    row.innerHTML = '<span class="t">' + e.t + '</span>' + e.msg;
    log.appendChild(row);
  });
}
</script>
</body>
</html>
